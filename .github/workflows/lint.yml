# https://github.com/kentcdodds/kentcdodds.com/blob/main/.github/workflows/deployment.yml
name: Format
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  format:
    name: 🎨 Format
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install

      # autofix.ci pushed the fixes itself, but its GitHub App is not installed
      # on this fork, so the action failed with a 500 and left the check red
      # without applying anything. Report instead, and let the author fix.
      - name: 🔬 Lint
        run: pnpm format:check
